# Import this public project into the existing Fortemate SonarQube Cloud organization.
sonar.organization=fortemate
sonar.projectKey=fortemate_dicechess-twitch
sonar.projectName=dicechess-twitch
sonar.sources=src,scripts
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPaths=tsconfig.json
# Real Node-test coverage. Unreported application files remain in Sonar's denominator.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
