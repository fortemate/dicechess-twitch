<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Broadcast · Twitch Plays Dice Chess</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/obs.js"></script>
  </head>
  <body class="broadcast">
    <main>
      <header class="masthead">
        <span class="brand-mark" aria-hidden="true">DC</span>
        <div>
          <p class="eyebrow">Streamer versus chat</p>
          <h1>Twitch Plays Dice Chess</h1>
        </div>
        <span class="pill">Application scaffold</span>
      </header>
      <section class="broadcast-stage" aria-label="Broadcast status">
        <div class="board-placeholder" aria-hidden="true">
          <span>THE TABLE<br />IS YOURS.</span>
        </div>
        <div class="broadcast-message">
          <p class="eyebrow">One board. A whole chat.</p>
          <p class="phase" id="phase">Connecting</p>
          <h2 id="message">Waiting for the local host</h2>
          <p class="muted">Twitch &amp; gameplay are not connected.</p>
          <p class="connection" id="connection" role="status">
            Connecting to host…
          </p>
        </div>
      </section>
      <footer class="broadcast-footer">
        <span>Local host / read-only scene</span
        ><span>Revision <b id="revision">—</b></span
        ><span>Session <span id="session">—</span></span>
      </footer>
    </main>
  </body>
</html>
